name: transcript-rag

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
    ipc: host
    
    volumes:
      - ./model-gptoss:/model-gptoss
    
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /model-gptoss
      --gpu-memory-utilization 0.80
      --max-model-len 20000
      --max-num-seqs 35
      --load-format safetensors
      --host 0.0.0.0
      --port 8000

  rag-api:
    build:
      context: ./transcript-rag
    command: uvicorn api:app --host 0.0.0.0 --port 8001 --workers 1
    restart: unless-stopped
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: /model-gptoss
      RAG_DATA_DIR: /app/const
      EMBEDDING_DEVICE: cuda
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./transcript-rag:/app
      - ./huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  transcript-rag:
    profiles: ["notebook"]
    build: 
      context: ./transcript-rag

    container_name: transcript-rag
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ports:
      - 8888:8888

    depends_on:
      - vllm

    volumes:
      - ./transcript-rag:/app
      - ./huggingface:/root/.cache/huggingface
